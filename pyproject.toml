[project]
name = "owid-vdem-data-task"
version = "0.1.0"
description = "Natural-language chart-data tasks from Our World in Data charts built on V-Dem v16, with raw-data SQLite, golden processing programs and a benchmark harness."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "numpy==2.5.4",
    "openpyxl==3.1.5",
    "pandas==2.3.3",
    "pyyaml==6.0.2",
    "requests==2.32.3",
    "beautifulsoup4==4.12.3",
    "pyarrow==18.1.0",
    "pypdf==5.1.0",
]

[dependency-groups]
capture = [
    "pillow==11.0.0",
    "playwright==1.49.1",
]
dev = ["pytest==8.3.4", "ruff==0.8.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
